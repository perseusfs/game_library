<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kütüphane</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="lib-games">

  <header class="masthead">
    <div class="masthead-inner">

      <div class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <h1 class="wordmark" id="wordmark">Oyun Kütüphanesi</h1>
            <p class="brand-stat" id="collectionStat">Yükleniyor…</p>
          </div>
        </div>

        <div class="modeswitch" id="modeSwitch" role="tablist" aria-label="Library">
          <button class="ms-btn active" data-lib="games" role="tab">🎮 Oyunlar</button>
          <button class="ms-btn" data-lib="books" role="tab">📚 Kitaplar</button>
          <button class="ms-btn" data-lib="stats" role="tab">📊 İstatistik</button>
        </div>

        <div class="topbar-right">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Oyun ara…" aria-label="Search">
          </div>
          <button class="btn btn-soft icon-btn" id="themeBtn" title="Tema değiştir" aria-label="Tema değiştir">☾</button>
          <button class="btn btn-soft" id="addBtn" hidden>+ Ekle</button>
          <button class="btn btn-soft" id="loginBtn" hidden>Giriş yap</button>
        </div>
      </div>

      <div class="filterbar">

        <!-- GAMES controls -->
        <div class="lib-controls" id="games-controls">
          <div class="filters" id="platformFilters">
            <label class="pill">
              <input type="checkbox" value="pc">
              <span class="pill-body"><span class="dot dot-pc"></span>PC <span class="pill-count" id="count-pc">0</span></span>
            </label>
            <label class="pill">
              <input type="checkbox" value="ps">
              <span class="pill-body"><span class="dot dot-ps"></span>PlayStation <span class="pill-count" id="count-ps">0</span></span>
            </label>
          </div>
          <div class="filters" id="flagFilters">
            <label class="pill"><input type="checkbox" value="favorite"><span class="pill-body"><span class="glyph">★</span> Favoriler</span></label>
            <label class="pill"><input type="checkbox" value="played"><span class="pill-body"><span class="glyph">✔</span> Oynananlar</span></label>
          </div>
          <div class="select-box">
            <select id="sort" aria-label="Sort games">
              <option value="none">Sırala: Varsayılan</option>
              <option value="name_asc">İsim A–Z</option>
              <option value="name_desc">İsim Z–A</option>
            </select>
          </div>
        </div>

        <!-- BOOKS controls -->
        <div class="lib-controls" id="books-controls" hidden>
          <div class="select-box"><select id="bGenre" aria-label="Tür"><option value="">Tür · hepsi</option></select></div>
          <div class="select-box"><select id="bLang" aria-label="Orijinal dil"><option value="">Dil · hepsi</option></select></div>
          <div class="select-box"><select id="bShelf" aria-label="Raf"><option value="">Raf · hepsi</option></select></div>
          <div class="select-box">
            <select id="bStatus" aria-label="Durum">
              <option value="">Durum · hepsi</option>
              <option value="read">Okundu</option>
              <option value="unread">Okunmadı</option>
              <option value="favorite">Favori</option>
            </select>
          </div>
          <div class="select-box">
            <select id="bSort" aria-label="Sırala">
              <option value="title">Başlığa göre</option>
              <option value="author">Yazara göre</option>
              <option value="year">Yıla göre</option>
              <option value="pages">Sayfaya göre</option>
              <option value="added">Eklenme sırası</option>
            </select>
          </div>
        </div>

      </div>
    </div>
  </header>

  <main class="content">

    <!-- GAMES view -->
    <section id="games-view">
      <section class="stats" id="stats"></section>
      <p class="results-meta" id="resultsMeta"></p>
      <div id="app" class="grid"></div>
      <div id="empty" class="empty" hidden></div>
    </section>

    <!-- BOOKS view -->
    <section id="books-view" hidden>
      <section class="stats" id="bStats"></section>
      <p class="results-meta" id="bResultsMeta"></p>
      <div id="bApp"></div>
      <div id="bEmpty" class="empty" hidden></div>
    </section>

    <!-- STATS view -->
    <section id="stats-view" hidden>
      <div id="statsApp" class="statsboard"></div>
    </section>

  </main>

  <!-- save bar (local mode) -->
  <div class="savebar" id="savebar" hidden>
    <span class="savebar-text" id="savebarText"></span>
    <div class="savebar-actions">
      <button class="btn btn-ghost" id="discardBtn">Geri al</button>
      <button class="btn btn-primary" id="saveBtn">Kaydet</button>
    </div>
  </div>

  <!-- login modal -->
  <div class="modal" id="loginModal" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Sahip girişi</h2>
      <p class="modal-sub">Kütüphaneyi yalnızca sahibi düzenleyebilir.</p>
      <label class="field"><span>E-posta</span><input id="loginEmail" type="email" autocomplete="username"></label>
      <label class="field"><span>Şifre</span><input id="loginPass" type="password" autocomplete="current-password"></label>
      <p class="form-error" id="loginError" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="loginModal">Vazgeç</button>
        <button class="btn btn-primary" id="loginSubmit">Giriş yap</button>
      </div>
    </div>
  </div>

  <!-- game add modal -->
  <div class="modal" id="addModal" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Oyun ekle</h2>
      <p class="modal-sub">Oyun zaten varsa, platform ve mağazayı yeni bir kopya olarak ekler.</p>
      <label class="field"><span>Ad</span><input id="gName" type="text"></label>
      <label class="field"><span>Kapak görseli URL (isteğe bağlı)</span><input id="gImage" type="url" placeholder="https://..."></label>
      <div class="field-row">
        <label class="field"><span>Platform</span>
          <select id="gPlatform"><option value="pc">PC</option><option value="ps5">PS5</option><option value="ps4">PS4</option><option value="ps3">PS3</option></select>
        </label>
        <label class="field"><span>Biçim</span>
          <select id="gType"><option value="digital">Dijital</option><option value="physical">Fiziksel (disk)</option></select>
        </label>
        <label class="field"><span>Mağaza</span>
          <select id="gStore"><option value="">— yok —</option><option value="steam">Steam</option><option value="epic">Epic</option><option value="ps_store">PS Store</option></select>
        </label>
      </div>
      <label class="field"><span>DLC — her satıra bir (isteğe bağlı)</span><textarea id="gDlc" rows="2"></textarea></label>
      <label class="field"><span>Sürümler — her satıra bir (isteğe bağlı)</span><textarea id="gEdition" rows="2"></textarea></label>
      <p class="form-error" id="addError" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="addModal">Vazgeç</button>
        <button class="btn btn-primary" id="addSubmit">Oyun ekle</button>
      </div>
    </div>
  </div>

  <!-- book add / edit modal -->
  <div class="modal" id="bookModal" hidden>
    <div class="modal-card modal-wide">
      <h2 class="modal-title" id="bookModalTitle">Yeni kitap</h2>
      <div class="book-grid">
        <label class="field span-2"><span>Kitap adı *</span><input id="bTitle" type="text"></label>
        <label class="field"><span>Yazar</span><input id="bAuthor" list="dl-authors" type="text"></label>
        <label class="field"><span>Yayınevi</span><input id="bPublisher" list="dl-publishers" type="text"></label>
        <label class="field"><span>Alan</span><input id="bField" list="dl-fields" type="text" placeholder="örn. Rus Edebiyatı"></label>
        <label class="field"><span>Tür</span><input id="bGenreIn" list="dl-genres" type="text" placeholder="örn. Roman"></label>
        <label class="field"><span>Orijinal dil</span><input id="bLangIn" list="dl-langs" type="text" placeholder="örn. Rusça"></label>
        <label class="field"><span>Raf kodu</span><input id="bShelfIn" list="dl-shelves" type="text" placeholder="U / B"></label>
        <label class="field"><span>Sayfa sayısı</span><input id="bPages" type="number" min="0"></label>
        <label class="field"><span>Basım yılı</span><input id="bYear" type="number" step="1" placeholder="örn. 1866 (MÖ için -399)"></label>
      </div>
      <p class="form-error" id="bookError" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="bookModal">Vazgeç</button>
        <button class="btn btn-primary" id="bookSubmit">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- game detail -->
  <div class="modal" id="gameDetail" hidden>
    <div class="modal-card modal-detail">
      <button class="detail-close" data-close="gameDetail" aria-label="Kapat">✕</button>
      <div class="detail-grid">
        <div class="detail-cover"><img id="gdCover" alt=""></div>
        <div class="detail-body">
          <h2 class="detail-title" id="gdTitle"></h2>
          <div class="detail-meta" id="gdMeta"></div>
          <div class="detail-genres" id="gdGenres"></div>
          <div class="detail-platforms badges" id="gdPlatforms"></div>
          <p class="detail-summary" id="gdSummary"></p>
          <div class="detail-extra" id="gdExtra"></div>
          <button class="btn btn-soft detail-edit" id="gdEditBtn" hidden>Düzenle</button>
        </div>
      </div>
    </div>
  </div>

  <!-- edit game -->
  <div class="modal" id="editModal" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Oyunu düzenle</h2>
      <p class="modal-sub">Eksik veya yanlış bilgileri düzelt. Platform/kopya bilgisi burada değişmez.</p>
      <label class="field"><span>Ad</span><input id="eName" type="text"></label>
      <label class="field"><span>Kapak görseli URL</span><input id="eImage" type="url" placeholder="https://..."></label>
      <label class="field"><span>Yıl / çıkış tarihi</span><input id="eReleased" type="text" placeholder="1998 veya 1998-11-30"></label>
      <label class="field"><span>Türler — virgülle ayır</span><input id="eGenres" type="text" placeholder="Action, RPG"></label>
      <label class="field"><span>Özet</span><textarea id="eDescription" rows="6"></textarea></label>
      <p class="form-error" id="editError" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-soft" data-close="editModal">Vazgeç</button>
        <button class="btn btn-primary" id="editSubmit">Kaydet</button>
      </div>
    </div>
  </div>

  <datalist id="dl-authors"></datalist>
  <datalist id="dl-publishers"></datalist>
  <datalist id="dl-fields"></datalist>
  <datalist id="dl-genres"></datalist>
  <datalist id="dl-langs"></datalist>
  <datalist id="dl-shelves"></datalist>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
