<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Library</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner">

      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1 class="wordmark">Game Library</h1>
          <p class="brand-stat" id="collectionStat">Loading collection…</p>
        </div>
      </div>

      <div class="controls">

        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search games" aria-label="Search games">
        </div>

        <div class="filters" id="platformFilters">
          <label class="pill">
            <input type="checkbox" value="pc">
            <span class="pill-body">
              <span class="dot dot-pc" aria-hidden="true"></span>
              PC
              <span class="pill-count" id="count-pc">0</span>
            </span>
          </label>
          <label class="pill">
            <input type="checkbox" value="ps">
            <span class="pill-body">
              <span class="dot dot-ps" aria-hidden="true"></span>
              PlayStation
              <span class="pill-count" id="count-ps">0</span>
            </span>
          </label>
        </div>

        <div class="filters" id="flagFilters">
          <label class="pill">
            <input type="checkbox" value="favorite">
            <span class="pill-body"><span class="glyph">★</span> Favorites</span>
          </label>
          <label class="pill">
            <input type="checkbox" value="played">
            <span class="pill-body"><span class="glyph">✔</span> Played</span>
          </label>
        </div>

        <div class="select-box">
          <select id="sort" aria-label="Sort games">
            <option value="none">Sort: Default</option>
            <option value="name_asc">Name A–Z</option>
            <option value="name_desc">Name Z–A</option>
          </select>
        </div>

        <button class="btn btn-soft" id="addBtn" hidden>+ Add game</button>
        <button class="btn btn-soft" id="loginBtn" hidden>Sign in</button>

      </div>
    </div>
  </header>

  <main class="content">
    <section class="stats" id="stats" aria-label="Collection overview"></section>
    <p class="results-meta" id="resultsMeta"></p>
    <div id="app" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <!-- save bar (local mode only) -->
  <div class="savebar" id="savebar" hidden>
    <span class="savebar-text" id="savebarText"></span>
    <div class="savebar-actions">
      <button class="btn btn-ghost" id="discardBtn">Discard</button>
      <button class="btn btn-primary" id="saveBtn">Save changes</button>
    </div>
  </div>

  <!-- login modal -->
  <div class="modal" id="loginModal" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Owner sign in</h2>
      <p class="modal-sub">Only the owner can edit the library.</p>
      <label class="field"><span>Email</span>
        <input id="loginEmail" type="email" autocomplete="username">
      </label>
      <label class="field"><span>Password</span>
        <input id="loginPass" type="password" autocomplete="current-password">
      </label>
      <p class="form-error" id="loginError" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="loginModal">Cancel</button>
        <button class="btn btn-primary" id="loginSubmit">Sign in</button>
      </div>
    </div>
  </div>

  <!-- add-game modal -->
  <div class="modal" id="addModal" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Add a game</h2>
      <p class="modal-sub">If the game already exists, this adds the platform and store as another copy.</p>
      <label class="field"><span>Name</span>
        <input id="gName" type="text">
      </label>
      <label class="field"><span>Cover image URL (optional)</span>
        <input id="gImage" type="url" placeholder="https://...">
      </label>
      <div class="field-row">
        <label class="field"><span>Platform</span>
          <select id="gPlatform">
            <option value="pc">PC</option>
            <option value="ps5">PS5</option>
            <option value="ps4">PS4</option>
            <option value="ps3">PS3</option>
          </select>
        </label>
        <label class="field"><span>Type</span>
          <select id="gType">
            <option value="digital">Digital</option>
            <option value="physical">Physical (disc)</option>
          </select>
        </label>
        <label class="field"><span>Store</span>
          <select id="gStore">
            <option value="">— none —</option>
            <option value="steam">Steam</option>
            <option value="epic">Epic</option>
            <option value="ps_store">PS Store</option>
          </select>
        </label>
      </div>
      <label class="field"><span>DLC — one per line (optional)</span>
        <textarea id="gDlc" rows="2" placeholder="Season Pass&#10;Expansion Pack"></textarea>
      </label>
      <label class="field"><span>Editions — one per line (optional)</span>
        <textarea id="gEdition" rows="2" placeholder="Deluxe Edition"></textarea>
      </label>
      <p class="form-error" id="addError" hidden></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close="addModal">Cancel</button>
        <button class="btn btn-primary" id="addSubmit">Add game</button>
      </div>
    </div>
  </div>

  <!-- Supabase client (safe to load on GitHub Pages) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
